name: Demo veröffentlichen

# Baut die Anwendung und stellt sie auf GitHub Pages bereit. Die Tests laufen
# hier bewusst noch einmal mit: Was online geht, soll nicht nur gebaut, sondern
# auch gerechnet worden sein.
#
# Statisches Hosting reicht vollständig aus — es gibt kein Backend, und durch
# `base: './'` plus HashRouter braucht es weder angepasste Pfade noch ein
# Server-Rewrite für Unterseiten.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deploy nach dem anderen, laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # `enablement` schaltet Pages beim ersten Lauf selbst ein. Ohne das
      # scheitert der Schritt in einem frischen Fork, solange niemand Pages
      # vorher von Hand aktiviert hat.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
